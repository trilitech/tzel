[package]
name = "tzel-verifier"
version = "0.1.0"
edition = "2021"

[lib]
name = "tzel_verifier"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
hex = "0.4"
indexmap = { version = "2.13.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
starknet-types-core = { version = "=0.2.4", default-features = false, features = ["hash"] }
tzel-core = { path = "../core" }
zstd = "0.13"

stwo = { version = "2.2.0", default-features = false }
stwo-constraint-framework = { version = "2.2.0", default-features = false }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-multiverifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cairo-program-runner-lib = { path = "/home/saroupille/git/proving-utils/crates/cairo-program-runner-lib" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["custom"] }

[dev-dependencies]
serde_json = "1"
