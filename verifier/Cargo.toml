[package]
name = "tzel-verifier"
version = "0.1.0"
edition = "2021"

[lib]
name = "tzel_verifier"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
hex = "0.4"
leanvm = { path = "../third_party/leanvm/crates/leanvm_core" }
serde = { version = "1", features = ["derive"] }
tzel-core = { path = "../core" }
tzel-host = { path = "../third_party/leanvm/programs/tzel/host" }
zstd = "0.13"

[dev-dependencies]
serde_json = "1"
