[package]
name = "tzel-reprover"
version = "0.1.0"
edition = "2024"

[lib]
name = "tzel_reprover"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.98"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
itertools = { version = "0.12", default-features = false, features = ["use_alloc"] }
indexmap = { version = "2.10.0", default-features = false, features = ["std"] }
serde_json = "1.0"
starknet-types-core = "=0.2.4"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

# cairo-vm
cairo-vm = { version = "=3.2.0", features = ["extensive_hints", "mod_builtin"] }

# proving-utils (local fork — bumped to stwo-circuits 2bf051f)
cairo-program-runner-lib = { path = "/home/saroupille/git/proving-utils/crates/cairo-program-runner-lib" }
privacy-prove = { path = "/home/saroupille/git/proving-utils/crates/privacy_prove" }
privacy-circuit-verify = { path = "/home/saroupille/git/proving-utils/crates/privacy_circuit_verify" }

serde = { version = "1.0", features = ["derive"] }
tzel-core = { path = "../../core" }

# stwo cairo (same revs as proving-utils v1.2.2)
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-prover = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo = { version = "2.2.0", features = ["parallel", "prover", "poseidon2_bn254"] }
stwo-constraint-framework = "2.2.0"

# stwo circuits — bumped to 2bf051f to surface circuit-multiverifier
circuit-cairo-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-prover = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-multiverifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }

[profile.release]
opt-level = 3

[patch.crates-io]
# SPIKE (item-d bn254 outer layer): re-point stwo onto our fork
# (~/git/stwo @ feat/item-d-poseidon2-bn254, v2.2.0 + feature-gated additions).
# poseidon2_bn254 feature ENABLED on the direct stwo dep above (line 40) so the
# Bn254Channel / Poseidon2Bn254MerkleChannel types + SimdBackend BackendForChannel
# impls are in scope for the outer recursion layer.
# Reproducible form: our fork branch (pushed @ 25ad672b). For local fork iteration,
# swap these for `path = "/abs/path/to/stwo/crates/{stwo,constraint-framework}"`.
stwo = { git = "https://github.com/trilitech/stwo", branch = "feat/item-d-poseidon2-bn254" }
stwo-constraint-framework = { git = "https://github.com/trilitech/stwo", branch = "feat/item-d-poseidon2-bn254" }

[workspace]
