[package]
name = "tzel-reprover"
version = "0.1.0"
edition = "2024"

[lib]
name = "tzel_reprover"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.98"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
itertools = { version = "0.12", default-features = false, features = ["use_alloc"] }
indexmap = { version = "2.10.0", default-features = false, features = ["std"] }
serde_json = "1.0"
starknet-types-core = "=0.2.4"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

# cairo-vm
cairo-vm = { version = "=3.2.0", features = ["extensive_hints", "mod_builtin"] }

# proving-utils (local fork — bumped to stwo-circuits 2bf051f)
cairo-program-runner-lib = { path = "/home/saroupille/git/proving-utils/crates/cairo-program-runner-lib" }
privacy-prove = { path = "/home/saroupille/git/proving-utils/crates/privacy_prove" }
privacy-circuit-verify = { path = "/home/saroupille/git/proving-utils/crates/privacy_circuit_verify" }

serde = { version = "1.0", features = ["derive"] }
# L3 perf: mimalloc global allocator (installed in lib.rs) — kills the allocator
# churn the OUTER CPU profile flags in the QM31/rayon remainder. MUST be a regular
# dependency (not dev-dep): lib.rs installs it via #[global_allocator] in the
# LIBRARY build, and dev-dependencies are unavailable to lib/bin targets.
mimalloc = { version = "0.1", default-features = false }
tzel-core = { path = "../../core" }

# D-g4 BN254 serializer: `Bn254Hash.0.into_bigint()` (PrimeField). Version MUST
# match stwo's `poseidon2_bn254` feature (ark-ff 0.5) so the `Fr` type unifies.
ark-ff = { version = "0.5", default-features = false }

# stwo cairo (same revs as proving-utils v1.2.2)
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-prover = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo = { version = "2.2.0", features = ["parallel", "prover", "poseidon2_bn254", "poseidon2_m31"] }
stwo-constraint-framework = "2.2.0"

# stwo circuits — bumped to 2bf051f to surface circuit-multiverifier
circuit-cairo-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-prover = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }
circuit-multiverifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2bf051f" }

[dev-dependencies]
# D-g4 round-trip test: construct synthetic `Bn254Hash` values. Version MUST
# match stwo's `poseidon2_bn254` feature (ark-bn254 0.5) so the `Fr` type
# unifies with `Bn254Hash`'s (ark-ff is a regular dep above).
ark-bn254 = { version = "0.5", default-features = false, features = ["scalar_field"] }

[profile.release]
opt-level = 3
# L3 perf: fat LTO + single codegen unit cross-inline the tiny PackedQM31/CM31
# field ops (function-call-shaped in the profile) across crates → ~3-8% on the
# CPU phases (leaves/mv/OUTER blake2s + fft3 + QM31). Pure codegen, no
# correctness risk; costs build time only.
lto = "fat"
codegen-units = 1

[patch.crates-io]
# SPIKE (item-b/item-d outer layers): re-point stwo onto our fork.
# feat/item-b-poseidon2-m31 is branched off feat/item-d-poseidon2-bn254, so it is a
# SUPERSET: it carries BOTH the BN254 channel (poseidon2_bn254) AND the Poseidon2-M31
# channel (poseidon2_m31) + the SIMD perf work. Both features ENABLED on the direct
# stwo dep above (line 40) so the Bn254Channel / Poseidon2Bn254MerkleChannel AND the
# Poseidon2M31MerkleChannel types + their SimdBackend BackendForChannel impls are in
# scope for the outer recursion layer (the M31 outer node round-trips over a real
# mv-root @96-bit; the BN254 outer node is the small final re-commit stage).
# Reproducible form: our fork branch. For local fork iteration, swap these for
# `path = "/abs/path/to/stwo/crates/{stwo,constraint-framework}"`.
stwo = { git = "https://github.com/trilitech/stwo", branch = "feat/item-b-poseidon2-m31" }
stwo-constraint-framework = { git = "https://github.com/trilitech/stwo", branch = "feat/item-b-poseidon2-m31" }

[workspace]
