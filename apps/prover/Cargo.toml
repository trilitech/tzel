[package]
name = "tzel-prover-app"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "reprove"
path = "src/main.rs"

# `tzel_insecure_sandbox` is a build-time --cfg (sandbox/CI only, never
# prod) that enables the no-proving stub mode. Declare it to silence the
# unexpected-cfg lint.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tzel_insecure_sandbox)'] }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tzel-verifier = { path = "../../verifier" }
tzel-reprover = { path = "../../services/reprover" }
tzel-core = { path = "../../core" }
