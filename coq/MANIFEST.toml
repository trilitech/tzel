# coq/MANIFEST.toml
#
# Drift-detection manifest mapping the modeled leanVM circuit source file
# to its [Impl] mirror(s) and pinning the source file's SHA-256. CI runs
# coq/Drift/check.sh which re-hashes each source path and fails if the
# value diverges from the SHA pinned here.
#
# Bumping a SHA is the explicit signal "the circuit source changed; the
# [Impl] mirror has been re-read and updated to match." The hash check
# is a speed bump that forces re-review, not a security guarantee — its
# job is to make silent drift impossible. Cosmetic circuit edits will
# trigger false alarms; that's the intended cost.
#
# Only the [Impl] layer mirrors specific circuit source files. The [Spec]
# layer is whitepaper-derived and intentionally has no source-file
# correspondence to drift against.

[[mirror]]
source = "third_party/leanvm/programs/tzel/guest/src/lib.rs"
coq    = [
  "coq/Impl/Hashes.v",
  "coq/Impl/Merkle.v",
  "coq/Impl/Wots.v",
  "coq/Impl/Xmss.v",
  "coq/Impl/Transfer.v",
  "coq/Impl/Shield.v",
  "coq/Impl/Unshield.v",
]
# Multiasset leanVM migration (MAX_INPUTS = 5): consolidates blake_hash,
# merkle, xmss_common, shield, transfer, and unshield circuits into the
# leanVM guest library while preserving the identical BLAKE2s-251 hash
# primitives, WOTS+/XMSS verification, 2-accumulator per-asset balance
# closure, and producer-fee ASSET_TEZ pin modeled in coq/Spec and coq/Impl.
sha256 = "03c5fe051572731e1a90ec5c4770c2fea6418720b623ce0d73021a3c2774c3fc"

