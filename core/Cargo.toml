[package]
name = "tzel-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "tzel_core"
path = "src/lib.rs"

[dependencies]
blake2s_simd = "1.0"
hex = "0.4"
chacha20poly1305 = "0.10"
ml-kem = "=0.3.2"
serde = { version = "1", features = ["derive"] }
tezos_data_encoding = "0.6"
tezos-smart-rollup-encoding = "0.2.2"
nom = "7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.9"
serde_json = "1"

[features]
default = []
# Test-only feature: enables a thread-local override on
# COMPILE_TIME_FA2_BRIDGES so integration tests in downstream crates
# (notably tezos-rollup-kernel) can register synthetic FA2 ticketers
# without polluting the production kernel binary. NEVER enable this
# in release builds.
test-fa2-bridges = []

[dev-dependencies]
proptest = "1"
