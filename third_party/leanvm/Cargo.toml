[workspace]
members = ["crates/*", "sdk", "programs/tzel/host"]
exclude = ["programs/tzel/guest"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
semicolon_if_nothing_returned = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"
redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
unused_peekable = "allow"
tuple_array_conversions = "allow"
transmute_undefined_repr = "allow"
cognitive_complexity = "allow"

[workspace.dependencies]
bench = { path = "crates/bench" }
leanvm = { path = "crates/leanvm_core" }
primitives = { path = "crates/primitives" }
fiat_shamir = { path = "crates/fiat_shamir" }
pcs = { path = "crates/pcs" }
flock = { path = "crates/flock" }
parallel = { path = "crates/parallel" }
zk = { path = "crates/zk" }
leanvm_guest = { path = "sdk" }
tzel-host = { path = "programs/tzel/host" }
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
rand_core = { version = "0.9", default-features = false }
thiserror = { version = "2", default-features = false }
tikv-jemallocator = "0.7"
tracing = "0.1.26"
tracing-forest = { version = "0.3.0", features = ["ansi", "smallvec"] }
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
