name: Unit Tests

on:
  push:
    branches:
      - main
      - multiasset
    paths-ignore:
      - "docs/pq.png"
  pull_request:
    paths-ignore:
      - "docs/pq.png"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZEL_TRAP_FULL_XMSS_REBUILDS: "1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-04-30

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2.7.8
        with:
          shared-key: rust-leanvm

      - name: Run Rust unit tests
        run: |
          cargo test -p tzel-core --lib
          cargo test -p tzel-host
          cargo test -p tzel-verifier --lib
          cargo test --lib -p tzel-services
          cargo test --test integration -p tzel-services
          cargo test --manifest-path services/tzel/Cargo.toml --bin tzel-operator
          cargo test -p tzel-rollup-kernel --lib
          cargo test -p tzel-rollup-kernel --test bridge_flow
          cargo test -p tzel-rollup-kernel --test multiasset_routing
          cargo test -p tzel-rollup-kernel --bin verified_bridge_fixture_message
          cargo test -p tzel-rollup-kernel --no-default-features --lib
          cargo test -p tzel-rollup-kernel --no-default-features --test bridge_flow
          cargo test -p tzel-wallet-app --lib
          cargo test -p tzel-ledger-app --bin sp-ledger
          cargo test -p tzel-demo

      - name: Check deployment script syntax
        run: |
          bash -n scripts/octez_rollup_sandbox_smoke.sh
          bash -n scripts/octez_rollup_sandbox_dal_smoke.sh
          bash -n scripts/prepare_rollup_config_admin.sh
          bash -n scripts/submit_rollup_config.sh
          bash -n scripts/build_rollup_kernel_release.sh
          bash -n scripts/install_tzel_binaries.sh
          bash -n scripts/init_shadownet_operator_box.sh
          bash -n scripts/shadownet_operator_preflight.sh
          bash -n scripts/shadownet_live_e2e_smoke.sh

      - name: Run script unit tests
        run: |
          PYTHONPATH=. python3 -m unittest \
            scripts.tests.test_build_alpha_sandbox_params \
            scripts.tests.test_submit_rollup_config \
            scripts.tests.test_octez_rollup_sandbox_dal_smoke \
            scripts.tests.test_shadownet_operator_paths \
            scripts.tests.test_workflow_references

  ocaml:
    runs-on: ubuntu-latest
    env:
      LIBRARY_PATH: ${{ github.workspace }}/ocaml/vendor/mlkem-native/test/build
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install OCaml system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev pkg-config

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014  # v3
        with:
          ocaml-compiler: "5.2.0"

      - name: Install OCaml dependencies
        run: |
          opam install -y dune alcotest cstruct ctypes ctypes-foreign hex mirage-crypto yojson digestif

      - name: Build ML-KEM native library
        run: make -C ocaml/vendor/mlkem-native lib

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-04-30

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2.7.8
        with:
          shared-key: ocaml-cross-impl

      - name: Run OCaml unit tests
        run: opam exec -- ./scripts/ocaml_unit_tests.sh

      - name: Run cross-implementation interop test
        run: opam exec -- cargo test --test cross_impl_interop -p tzel-services
